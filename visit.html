<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src https://script.google.com https://script.googleusercontent.com https://api.open-meteo.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<title>작은책방</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Gothic:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="bookshop.css?v=4">
<link rel="stylesheet" href="visit.css?v=1">
</head>
<body>
<div class="wrap">
  <div class="notice" id="notice" hidden></div>
  <header>
    <div><h1 id="title">작은책방</h1><p class="since" id="sinceText"></p></div>
  </header>

  <div class="grid">
    <div>
      <div class="views" role="tablist" aria-label="화면">
        <button role="tab" data-view="out">밖에서</button>
        <button role="tab" data-view="in">책방 안</button>
        <button role="tab" data-view="today" id="viewTodayBtn">추천 책</button>
        <button role="tab" data-view="wall">입고 예정</button>
      </div>
      <div class="scene-box">
        <svg id="scene" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="작은책방 그림"></svg>
        <button class="cover-pop" id="coverPop" hidden aria-label="표지 (두 번 누르면 좋아요)"></button>
        <div class="burst" id="burst" aria-hidden="true">♥</div>
      </div>
      <div class="pager" id="pager" hidden>
        <button class="btn" id="prev" aria-label="이전">이전</button>
        <span id="pageInfo"></span>
        <button class="btn" id="next" aria-label="다음">다음</button>
      </div>
      <p class="hint v-hint">문을 누르면 들어가고, 책을 누르면 꺼내 볼 수 있어요. 표지를 두 번 누르면 좋아요가 눌려요.</p>
    </div>

    <aside class="panel">
      <div class="detail v-detail" id="detail" hidden aria-live="polite"></div>
      <section class="card about">
        <h2>책방 소개</h2>
        <p>책방지기가 읽은 책을 한 권씩 꽂아 두는 작은 온라인 책방이에요. 마음에 드는 책에 좋아요와 한마디를 남겨 주세요.</p>
      </section>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="visit.js?v=1"></script>
</body>
</html>
